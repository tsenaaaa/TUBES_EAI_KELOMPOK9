<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Customer Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h2>Customer Management</h2>

  <!-- Form tambah/edit customer -->
  <form id="customerForm" class="mb-4">
    <input type="hidden" name="id" />
    <div class="row g-3">
      <div class="col-md-3">
        <input type="text" class="form-control" name="name" placeholder="Customer Name" required>
      </div>
      <div class="col-md-3">
        <input type="email" class="form-control" name="email" placeholder="Email" required>
      </div>
      <div class="col-md-3">
        <input type="tel" class="form-control" name="phone" placeholder="Phone Number" required>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">Add Customer</button>
        <button type="button" class="btn btn-secondary w-100 d-none" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </form>

  <!-- Tabel customer -->
  <table class="table table-bordered" id="customerTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const apiUrl = 'http://localhost:8000/api/customer';

    async function loadCustomers() {
      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Failed to fetch customers');
        const customers = await res.json();
        const tbody = document.querySelector('#customerTable tbody');
        tbody.innerHTML = '';
        customers.forEach(c => {
          tbody.innerHTML += `
            <tr>
              <td>${c.id}</td>
              <td>${c.name}</td>
              <td>${c.email}</td>
              <td>${c.phone || '-'}</td>
              <td>
                <button onclick="startEdit(${c.id})" class="btn btn-warning btn-sm me-2">Edit</button>
                <button onclick="deleteCustomer(${c.id})" class="btn btn-danger btn-sm">Delete</button>
              </td>
            </tr>`;
        });
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById('customerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const id = form.id.value;
      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim()
      };

      try {
        let res;
        if (id) {
          // Update existing customer
          res = await fetch(`${apiUrl}/${id}`, {
            method: 'PUT', // atau PATCH sesuai API backend
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
          });
          if (!res.ok) throw new Error('Failed to update customer');
        } else {
          // Add new customer
          res = await fetch(apiUrl, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
          });
          if (!res.ok) throw new Error('Failed to add customer');
        }

        form.reset();
        form.id.value = '';
        document.getElementById('submitBtn').textContent = 'Add Customer';
        document.getElementById('cancelBtn').classList.add('d-none');

        loadCustomers();
      } catch (error) {
        console.error(error);
      }
    });

    async function deleteCustomer(id) {
      if (!confirm('Are you sure want to delete this customer?')) return;
      try {
        const res = await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete customer');
        loadCustomers();
      } catch (error) {
        console.error(error);
      }
    }

    async function startEdit(id) {
      try {
        const res = await fetch(`${apiUrl}/${id}`);
        if (!res.ok) throw new Error('Failed to fetch customer data');
        const c = await res.json();

        const form = document.getElementById('customerForm');
        form.id.value = c.id;
        form.name.value = c.name;
        form.email.value = c.email;
        form.phone.value = c.phone || '';

        document.getElementById('submitBtn').textContent = 'Update Customer';
        document.getElementById('cancelBtn').classList.remove('d-none');
      } catch (error) {
        console.error(error);
      }
    }

    // Cancel edit, reset form
    document.getElementById('cancelBtn').addEventListener('click', () => {
      const form = document.getElementById('customerForm');
      form.reset();
      form.id.value = '';
      document.getElementById('submitBtn').textContent = 'Add Customer';
      document.getElementById('cancelBtn').classList.add('d-none');
    });

    loadCustomers();
  </script>
</body>
</html>
