<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Invoice Pembayaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="form-hotel">
      <h2>Invoice Pembayaran</h2>
      <p><strong>Nama Tamu:</strong> <span id="i-guest"></span></p>
      <p><strong>Nomor Kamar:</strong> <span id="i-room"></span></p>
      <p><strong>Layanan:</strong> <span id="i-service"></span></p>
      <p><strong>Total Bayar:</strong> <span id="i-amount"></span></p>
      <p><strong>Metode Pembayaran:</strong> <span id="i-method"></span></p>
      <p><strong>Catatan:</strong> <span id="i-note"></span></p>
      <p><strong>Tanggal:</strong> <span id="i-date"></span></p>
    </div>
  </div>
  <script src="invoice.js"></script>
</body>
</html>
